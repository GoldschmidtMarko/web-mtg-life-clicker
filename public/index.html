<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="js/util/themeInit.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="description" content="MTG Life Clicker - The ultimate Magic: The Gathering life counter app. Create lobbies, track life totals with friends, and enjoy multiplayer MTG games online.">
    <meta name="keywords" content="MTG, Magic The Gathering, life counter, life tracker, multiplayer, online, game, card game, lobby, life clicker">
    <meta name="author" content="MTG Life Clicker">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#6d5efc">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="./images/icon.png">
    <link rel="shortcut icon" type="image/png" href="./images/icon.png">
    <link rel="apple-touch-icon" href="./images/icon.png">

    <title>MTG Life Clicker - Magic: The Gathering Life Counter</title>
    <link rel="stylesheet" href="./css/tailwind.css">
    <link rel="stylesheet" href="./css/theme.css">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-functions-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <script src="js/indexScript.js" type="module"></script>
    <script src="js/infoPopup.js" type="module"></script>
    <script type="module">
        import { initThemeToggle } from './js/util/theme.js';
        document.addEventListener('DOMContentLoaded', () => initThemeToggle());
    </script>
</head>
<body>
    <div id="home-view" class="flex flex-col p-4 sm:p-6 pb-20 sm:pb-24 min-h-screen-dynamic w-full">

        <!-- Header controls -->
        <div class="w-full flex items-center justify-end gap-2 flex-shrink-0">
            <button id="sign-in-button" class="btn btn-ghost btn-sm">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 flex-shrink-0" viewBox="0 0 24 24">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                <span>Sign in with Google</span>
            </button>

            <button id="logout-button" class="btn btn-secondary btn-sm hidden">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                </svg>
                <span>Logout</span>
            </button>

            <button id="theme-toggle" class="icon-btn theme-toggle" aria-label="Toggle day and night theme" title="Toggle theme">
                <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="4"></circle>
                    <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
                </svg>
                <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>
        </div>

        <!-- Centered content -->
        <div class="flex-1 flex flex-col items-center justify-center w-full py-6">

        <!-- Hero title -->
        <div class="text-center mb-6 sm:mb-8">
            <h1 class="text-3xl sm:text-4xl lg:text-5xl font-bold tracking-tight mb-2" style="color: var(--ink);">
                MTG Life Clicker
            </h1>
            <p class="text-sm sm:text-base" style="color: var(--ink-dim);">
                Track life totals with friends
            </p>
        </div>

        <!-- Main content card -->
        <div class="card w-full max-w-sm sm:max-w-md p-5 sm:p-7 flex flex-col gap-4">

            <button id="create-lobby-btn" class="btn btn-primary btn-block">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span>Create New Lobby</span>
            </button>

            <div class="divider">or</div>

            <div class="flex flex-col gap-3">
                <h2 class="text-base font-semibold text-center" style="color: var(--ink);">Join Existing Lobby</h2>

                <input type="text" id="remote-player-name-input" placeholder="Your Player Name" class="field text-center" maxlength="15" />
                <input type="text" id="lobby-code-input" placeholder="Enter Lobby Code" class="field text-center tracking-widest" maxlength="20" />

                <button id="join-lobby-btn" class="btn btn-secondary btn-block">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
                    </svg>
                    <span>Join Lobby</span>
                </button>
            </div>
        </div>

        <!-- Your Lobbies: shown once signed in, if the player created or joined any -->
        <button id="my-lobbies-button" class="btn btn-secondary btn-block hidden w-full max-w-sm sm:max-w-md mt-4">
            <span id="my-lobbies-button-label">Your Lobbies</span>
        </button>
        </div>

        <!-- Your Lobbies modal -->
        <div id="my-lobbies-modal" class="modal-container hidden fixed inset-0 flex items-center justify-center z-50" style="background: var(--scrim);">
            <div class="my-lobbies-modal-content panel p-6 sm:p-8 w-full max-w-sm space-y-4">
                <div class="flex items-center justify-between">
                    <h2 class="text-xl font-bold" style="color: var(--ink);">Your Lobbies</h2>
                    <button id="close-my-lobbies-modal" class="icon-btn" aria-label="Close">&times;</button>
                </div>
                <div id="my-lobbies-list" class="flex flex-col gap-2 max-h-[60vh] overflow-y-auto pr-1"></div>
            </div>
        </div>

        <!-- Footer -->
        <footer class="text-center flex-shrink-0">
            <div class="flex flex-col items-center gap-2">
                <div class="flex items-center gap-3 text-xs" style="color: var(--ink-dim);">
                    <a href="impressum.html" class="hover:underline">Impressum</a>
                    <span aria-hidden="true">&middot;</span>
                    <a href="privacy.html" class="hover:underline">Privacy Policy</a>
                </div>
                <div class="text-xs" style="color: var(--ink-faint);">
                    &copy; <span id="copyright-year"></span> MTG Life Clicker. All rights reserved.
                </div>
            </div>
        </footer>
    </div>
    <script>document.getElementById('copyright-year').textContent = new Date().getFullYear();</script>
</body>
</html>
