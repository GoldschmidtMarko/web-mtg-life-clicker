<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <script src="js/util/themeInit.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="./images/icon.png">
    <link rel="shortcut icon" type="image/png" href="./images/icon.png">
    <link rel="apple-touch-icon" href="./images/icon.png">

    <title>Lobby - MTG Life Clicker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-functions-compat.js"></script>

    <link rel="stylesheet" href="./css/tailwind.css">
    <link rel="stylesheet" href="./css/theme.css">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./styles/lobby.css">
    <link rel="stylesheet" href="./styles/commanderModal.css">

    <!-- Custom JS -->
    <script src="js/lobbyScript.js" type="module"></script>
    <script src="js/settingsModalScript.js" type="module"></script>
    <script src="js/diceAnimation.js" type="module"></script>
    <script src="js/commanderModalScript.js" type="module"></script>
    <script type="module">
        import { initThemeToggle } from './js/util/theme.js';
        document.addEventListener('DOMContentLoaded', () => initThemeToggle());
    </script>
</head>

<body class="relative min-h-screen">

    <div id="lobby-container" class="relative z-10 flex flex-col p-3 sm:p-4 space-y-3 sm:space-y-4 w-full h-screen">
        <!-- Top Section -->
        <div class="flex flex-col md:flex-row md:gap-x-4 w-full">

            <!-- Left Panel -->
            <aside id="left-panel" class="left-section flex flex-col items-center w-full md:w-1/6 space-y-3">

                <div id="lobby-info" class="chip p-3 sm:p-4 w-full flex flex-row md:flex-col justify-between md:justify-center items-center space-x-2 md:space-x-0 md:space-y-2">
                    <div id="lobby-number" class="text-sm sm:text-base md:text-lg font-bold" style="color: var(--ink);">1234</div>
                    <div class="flex flex-row md:flex-col items-center space-x-2 md:space-x-0 md:space-y-2">
                        <button id="exit-lobby-button" class="btn btn-danger btn-sm">
                            <span>Exit Lobby</span>
                        </button>
                        <button id="settings-button" class="icon-btn">
                            <i class="fas fa-cogs text-xs sm:text-sm"></i>
                        </button>
                    </div>
                </div>

                <!-- Settings dropdown -->
                <div id="settings-frame" class="folding-frame hidden panel p-4 space-y-3 w-full">
                    <div class="flex gap-2 items-center justify-between">
                        <span class="text-sm font-semibold" style="color: var(--ink);">Theme</span>
                        <button id="theme-toggle" class="icon-btn theme-toggle" aria-label="Toggle day and night theme" title="Toggle theme">
                            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="4"></circle>
                                <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
                            </svg>
                            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                            </svg>
                        </button>
                    </div>
                    <div class="flex gap-2 items-center">
                        <button id="reset-life-button" class="btn btn-secondary btn-sm flex-1">
                            <span>Reset Life</span>
                        </button>
                        <input id="reset-life-input" type="number" value="40" class="field text-center" style="width: 4rem;" />
                    </div>
                    <div class="flex gap-2 items-center">
                        <button id="dice" class="btn btn-secondary btn-sm flex-1">
                            <span>Dice</span>
                        </button>
                        <input id="dice-eyes" type="number" value="20" class="field text-center" style="width: 4rem;" />
                    </div>
                    <div class="flex gap-2 items-center">
                        <button id="timer" class="btn btn-secondary btn-sm flex-1">
                            <span>Timer</span>
                        </button>
                        <input id="timer-duration" type="number" value="3" class="field text-center" style="width: 4rem;" />
                    </div>
                    <button class="btn btn-secondary btn-sm btn-block">
                        <span>New Feature</span>
                    </button>
                </div>

            </aside>

            <!-- Right Panel -->
            <div class="flex flex-col w-full md:w-3/4 p-2 flex-1 min-h-0">
                <!-- Scrollable Player Grid -->
                <div id="player-grid" class="grid grid-cols-2 gap-3 sm:gap-4 flex-1 overflow-y-auto min-h-0 p-2 rounded-2xl chip">
                    <!-- Players added dynamically -->
                </div>

                <!-- Fixed Buttons at Bottom -->
                <div id="bottom-controls" class="flex flex-col items-center mt-3 space-y-3 flex-shrink-0 pb-2">
                    <div class="flex items-center justify-center space-x-4 chip px-4 py-2">
                        <button id="prev-page" class="icon-btn">
                            <i class="fas fa-arrow-left"></i>
                        </button>
                        <div id="page-dots" class="flex space-x-2">
                            <span class="dot filled"></span>
                            <span class="dot"></span>
                            <span class="dot"></span>
                        </div>
                        <button id="next-page" class="icon-btn">
                            <i class="fas fa-arrow-right"></i>
                        </button>
                    </div>
                    <div class="flex gap-3 sm:gap-4 items-center">
                        <button id="abort-button" class="btn btn-danger">
                            <span>Abort</span>
                        </button>
                        <button id="add-dummy-player-button" class="btn btn-secondary">
                            <span>Add Player</span>
                        </button>
                        <button id="apply-button" class="btn btn-success">
                            <span>Apply</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Confirmation Modal -->
    <div id="confirmation-modal"
        class="modal-container hidden fixed inset-0 flex items-center justify-center z-50" style="background: var(--scrim);">
        <div class="confirmation-modal-content panel p-6 sm:p-8 w-full max-w-sm space-y-6">
            <p id="modal-Message" class="text-lg sm:text-xl font-semibold text-center" style="color: var(--ink);">Are you sure you want to remove this player?</p>
            <div class="flex justify-center gap-4">
                <button id="confirm-remove-button" class="btn btn-danger">
                    <span>Confirm</span>
                </button>
                <button id="cancel-remove-button" class="btn btn-secondary">
                    <span>Cancel</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="hidden fixed inset-0 flex justify-center items-center z-50" style="background: var(--scrim);">
        <div class="settings-modal-content panel p-6 sm:p-8 w-full max-w-sm space-y-6">
            <h2 class="text-2xl sm:text-3xl font-bold text-center" style="color: var(--ink);">Settings</h2>

            <div class="space-y-4 w-full">
                <div>
                    <label for="username" class="field-label">Name</label>
                    <input id="username" type="text" class="field" placeholder="Enter username">
                </div>

                <div>
                    <label for="bgColor" class="field-label">Background Color</label>
                    <input id="bgColor" type="color" value="#FFFFFF" class="field">
                </div>

                <div>
                    <label for="fontColor" class="field-label">Font Color</label>
                    <input id="fontColor" type="color" class="field">
                </div>

                <div class="flex items-center gap-2">
                    <input id="showCombinedStats" type="checkbox" class="field-checkbox">
                    <label for="showCombinedStats" class="text-sm" style="color: var(--ink);">Show infect &amp; commander damage on main page</label>
                </div>
            </div>

            <button id="saveSettings" class="btn btn-primary btn-block">
                <span>Save Settings</span>
            </button>
        </div>
    </div>

    <!-- Commander Modal -->
    <div id="commanderModal" class="hidden fixed inset-0 flex justify-center items-center z-50" style="background: var(--scrim);">
        <div class="commander-modal-content panel p-6 sm:p-8 w-full max-w-md space-y-6">
            <h2 id="commanderModalTitle" class="text-2xl sm:text-3xl font-bold text-center" style="color: var(--ink);">Commander Damage</h2>

            <div id="commanderDamageList" class="flex flex-col items-center w-full space-y-3">
                <!-- Commander damage entries will be added here by JavaScript -->
            </div>

            <div class="flex justify-end gap-4">
                <button id="closeCommanderModal" class="btn btn-secondary">
                    <span>Close</span>
                </button>
            </div>
        </div>
    </div>
</body>

</html>
